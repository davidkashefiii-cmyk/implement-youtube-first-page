<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube Colne</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gulzar&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        p{
            margin-top:0 ;
            font-family: Roboto , Arial;
        }
        .thumbnail{
            width:300px ;
            display: block;
        }
        .search-bar{
            font-size: 15px;
            padding:10px ;
            margin-left: 20px;
            border-color: blue;
            display: block;
        }
        .video-title{
            font-size: 14px;
            font-weight: 500;
            line-height: 20px;
            margin-bottom: 13px;
        }

       .video-preview{
        width: 300px;
        display: inline-block;
        vertical-align: top;
        margin-right: 15px;
       }

       .chanel-pic{
        display: inline-block;
        width: 40px;
        vertical-align: top;
       }

       .video-info{
        display: inline-block;
        width: 200px;
        vertical-align: top;
       }

       .chanel-image{
        width: 100%;
        border-radius: 50%;
       }
       .video-author , .video-stats {
        font-size: 12px;
        color: rgb(96 96 96);
       }
       .video-author{
        margin-bottom: 4px;
       }
       .thumbnail-container{
        margin-bottom: 10px;
       }


    </style>

</head>
<body>
        <input class="search-bar" type="text" placeholder="Search..."  >


  <div class="video-preview">

        <div class="thumbnail-container">    
            <img class="thumbnail" src="/thumbnail/hq720 (1).avif" alt="pic" >
        </div>
      <div>
              <div class="chanel-pic">
                 <img class="chanel-image" src="./chanel images/channels4_profile (1).jpg" alt="pic">
             </div>
           
              <div class="video-info" >
                  <p class="video-title">
                    Enrique Iglesias - Tonight (I'm Lovin' You) ft. Ludacris,DJ Frank E
                    </p>
                      <p class="video-author">
                         Enrique Iglesias
                      </p>
                       <p class="video-stats">
                          3.4M views - ago 6 months
                       </p>
             </div>
      </div>
 </div>

  <div class="video-preview">

        <div class="thumbnail-container">     
            <img class="thumbnail" src="/thumbnail/hq720 (2).avif" alt="pic">
       </div>

        <div>
             <div class="chanel-pic">
                <img class="chanel-image" src="./chanel images/channels4_profile (2).jpg" alt="pic">
             </div>
           
             <div class="video-info" >
                 <p class="video-title">
                 Instrumental music for programmers
                 <p class="video-author">
                  MR ROBOT FANS
                     </p>
                  <p class="video-stats">
                 1.4M views - ago 6 months
                 </p>
             </div>
        </div>
   </div>


</body>
</html>
